<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Purpl3L3an</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <style>
        :root {
            --bg-black: #090909;
            --surface-dark: #121212;
            --primary-purple: #813df5;
            --accent-purple: #be2edd;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background: linear-gradient(to bottom, #3e1b7a 0%, var(--bg-black) 100%);
            z-index: -1;
            opacity: 0.6;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            margin: 10px 20px 30px;
        }

        .search-container input {
            background: none;
            border: none;
            color: white;
            margin-left: 10px;
            outline: none;
            width: 100%;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 20px;
        }

        .music-card {
            background: var(--surface-dark);
            padding: 12px;
            border-radius: 12px;
            transition: transform 0.2s, opacity 0.3s;
            text-decoration: none;
            color: white;
            display: block;
        }

        .hidden {
            display: none;
        }

        .music-card:active {
            background: #282828;
            transform: scale(0.95);
        }

        .music-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .song-title {
            margin: 10px 0 0;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 0.7rem; 
            color: var(--text-dim);
        }

        /* Navigazione Bottom a 2 icone */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 75px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            flex: 1;
        }

        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary-purple); }

        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader {
            width: 40px; height: 40px;
            border: 3px solid var(--primary-purple);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body onload="hideLoader()">

    <div id="preloader">
        <div class="loader"></div>
    </div>

    <header>
        <h1 style="font-size: 1.2rem; margin: 0;">Buonasera</h1>
        <i class="fal fa-cog" style="font-size: 1.5rem;"></i>
    </header>

    <div class="search-container">
        <i class="fal fa-search" style="color: var(--text-dim);"></i>
        <input type="text" id="searchInput" placeholder="Cerca tra le tue canzoni">
    </div>

    <div class="music-grid" id="musicGrid">
        <a href="Dazero.html" class="music-card">
            <img src="img/Nayt.webp" alt="Nayt">
            <p class="song-title">Da zero</p>
            <span class="artist-name">Nayt</span>
        </a>

        <a href="!ly.html" class="music-card">
            <img src="img/!ly.webp" alt="!ly">
            <p class="song-title">!ly</p>
            <span class="artist-name">Thasup</span>
        </a>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fal fa-books"></i>
            <span>Libreria</span>
        </a>
    </nav>

    <script>
        function hideLoader() {
            setTimeout(() => {
                document.getElementById('preloader').style.display = 'none';
            }, 600);
        }

        const searchInput = document.getElementById('searchInput');
        const musicCards = document.querySelectorAll('.music-card');

        searchInput.addEventListener('input', (e) => {
            const filter = e.target.value.toLowerCase();
            musicCards.forEach(card => {
                const title = card.querySelector('.song-title').innerText.toLowerCase();
                const artist = card.querySelector('.artist-name').innerText.toLowerCase();
                if (title.includes(filter) || artist.includes(filter)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
