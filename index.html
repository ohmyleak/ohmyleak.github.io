<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purpl3L3an</title>
    <style>
        /* Sfondo della pagina */
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenitore del Player */
        .player-card {
            background: #2e0249;
            background: linear-gradient(145deg, #570a88, #2e0249);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 350px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Copertina finta o Icona */
        .album-art {
            width: 150px;
            height: 150px;
            background-color: #a91079;
            margin: 0 auto 20px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h2 {
            margin: 10px 0 5px;
            font-size: 1.4rem;
        }

        p {
            margin: 0 0 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Personalizzazione del tag audio */
        audio {
            width: 100%;
            height: 45px;
            border-radius: 10px;
            outline: none;
        }

        /* Nota: Lo stile interno dei controlli audio standard è limitato, 
           ma con i browser moderni possiamo applicare dei filtri */
        audio::-webkit-media-controls-enclosure {
            background-color: #f1eaff;
        }

        /* Footer del player */
        .footer-text {
            margin-top: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art">🎵</div>
        
        <h2>Da zero</h2>
        <p>Nayt / DOOM</p>

        <audio controls>
            <source src="dazero.mp3" type="audio/mpeg">
            Il tuo browser non supporta l'elemento audio.
        </audio>

        <div class="footer-text">JustForMia</div>
    </div>

</body>
</html>
