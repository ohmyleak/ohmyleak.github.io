<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purpl3L3an</title>
    <style>
        body {
            background-color: #6227eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
    
        .player-card {
            background: linear-gradient(145deg, #570a88, #2e0249);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 320px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    
        .album-art {
            width: 260px;
            height: 260px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #be2edd;
        }
    
        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    
        h2 { margin: 10px 0 5px; font-size: 1.5rem; letter-spacing: 1px; }
        p { margin: 0 0 25px; font-size: 1rem; opacity: 0.8; color: #d099ff; }

        .custom-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #be2edd, #ffffff);
            border-radius: 10px;
            box-shadow: 0 0 12px #be2edd;
            transition: width 0.1s linear;
        }

        /* TASTO PLAY PERSONALIZZATO */
        .play-btn {
            background: #ffffff;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            padding: 0; /* Rimuove padding che sballa l'icona */
        }

        /* Stile per l'icona dentro il tasto */
        .play-btn svg {
            width: 25px;
            height: 25px;
            fill: #2e0249; /* Colore dell'icona */
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: #be2edd;
        }

        .play-btn:hover svg {
            fill: white;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art">
            <img src="https://casadeldiscofaenza.it/wp-content/uploads/2025/01/71SP04tsQlL._UF10001000_QL80_.jpg" alt="Copertina">
        </div>
        
        <h2>Da zero</h2>
        <p>Nayt / DOOM</p>

        <div class="custom-player">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <button class="play-btn" id="playBtn">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
        </div>

        <audio id="mainAudio">
            <source src="dazero.mp3" type="audio/mpeg">
        </audio>

        <div class="footer-text">JustForMia</div>
    </div>

    <script>
        const audio = document.getElementById('mainAudio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        // Icone SVG definite come stringhe di percorso (path)
        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.querySelector('path').setAttribute('d', pausePath);
            } else {
                audio.pause();
                playIcon.querySelector('path').setAttribute('d', playPath);
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            playIcon.querySelector('path').setAttribute('d', playPath);
            progressBar.style.width = '0%';
        });
    </script>

</body>
</html>
