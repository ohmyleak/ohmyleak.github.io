<style>
    body {
        background-color: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; /* Usa min-height così non sballa */
        margin: 0;
        font-family: sans-serif;
    }

    .player-card {
        background: linear-gradient(145deg, #570a88, #2e0249);
        padding: 25px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 320px; /* Larghezza fissa del player */
        color: white;
    }

    .album-art {
        width: 250px;  /* Larghezza fissa della copertina */
        height: 250px; /* Altezza fissa della copertina */
        margin: 0 auto 20px;
        border-radius: 15px;
        overflow: hidden; /* Fondamentale: taglia l'immagine che esce fuori */
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        background-color: #444; /* Colore di recupero se l'immagine non carica */
    }

    .album-art img {
        width: 100%;
</head>
<body>

    <div class="player-card">
        <div class="album-art">
        <img src="https://casadeldiscofaenza.it/wp-content/uploads/2025/01/71SP04tsQlL._UF10001000_QL80_.jpg" alt="Copertina">
        </div>
