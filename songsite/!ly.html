<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>!ly - Purpl3L3an</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #121217;
            --primary-violet: #8b5cf6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background: radial-gradient(circle at top, #1e1033 0%, var(--bg-dark) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
    
        .player-card {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 340px;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    
        .album-art {
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: relative;
        }
    
        .album-art img { width: 100%; height: 100%; object-fit: cover; }
    
        h2 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
        p { margin: 8px 0 32px; font-size: 1.1rem; color: var(--text-dim); font-weight: 400; }

        .custom-player { display: flex; flex-direction: column; align-items: center; gap: 24px; }

        #progress-container {
            width: 100%; height: 6px; background: rgba(255, 255, 255, 0.05);
            border-radius: 20px; cursor: pointer;
        }

        #progress-bar {
            width: 0%; height: 100%; 
            background: var(--primary-violet);
            border-radius: 20px; 
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
            transition: width 0.1s linear;
        }

        .controls-row {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
        }

        .action-btn {
            background: none; border: none; cursor: pointer; color: var(--text-dim);
            transition: all 0.3s ease; font-size: 1.2rem;
        }

        .action-btn:hover { color: var(--text-main); }

        .play-btn {
            background: var(--text-main); border: none; width: 72px; height: 72px;
            border-radius: 50%; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.2);
        }

        .play-btn svg { width: 28px; height: 28px; fill: var(--bg-dark); }
        .play-btn:hover { transform: scale(1.05); background: var(--primary-violet); }
        .play-btn:hover svg { fill: white; }

        .loop-btn.active { color: var(--primary-violet); filter: drop-shadow(0 0 8px var(--primary-violet)); }

        .footer-text { margin-top: 35px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; color: var(--text-dim); opacity: 0.3; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art">
            <img src="https://i.scdn.co/image/ab67616d0000b2732f362ec65a3b674cdebd19e1" alt="Copertina">
        </div>
        
        <h2>!ly</h2>
        <p>Thasup • Carattere speciale</p>

        <div class="custom-player">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="controls-row">
                <button class="action-btn" onclick="window.location.href='../index.html'"><i class="fas fa-home"></i></button>
                
                <button class="play-btn" id="playBtn">
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>

                <button class="action-btn loop-btn" id="loopBtn">
                    <i class="fas fa-redo-alt"></i>
                </button>
            </div>
        </div>

        <audio id="mainAudio" src="../music/!ly.mp3"></audio>

        <div class="footer-text">Purpl3L3an Player</div>
    </div>

<script>
    const audio = document.getElementById('mainAudio');
    const playBtn = document.getElementById('playBtn');
    const loopBtn = document.getElementById('loopBtn');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');

    const playPath = "M8 5v14l11-7z";
    const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

    function updatePlayIcon(isPlaying) {
        const path = isPlaying ? pausePath : playPath;
        playIcon.querySelector('path').setAttribute('d', path);
    }

    // 1. GESTIONE AUTOPLAY ALL'AVVIO
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('autoplayNext') === 'true') {
            audio.play().then(() => {
                updatePlayIcon(true);
            }).catch(() => {
                updatePlayIcon(false);
                document.addEventListener('click', () => {
                    audio.play();
                    updatePlayIcon(true);
                }, { once: true });
            });
        }
    });

    // 2. CONTROLLI PLAY/PAUSE
    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            updatePlayIcon(true);
        } else {
            audio.pause();
            updatePlayIcon(false);
        }
    });

    // 3. LOOP
    loopBtn.addEventListener('click', () => {
        audio.loop = !audio.loop;
        loopBtn.classList.toggle('active');
    });

    // 4. PROGRESS BAR
    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
        }
    });

    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    });

    // 5. FINE CANZONE (LOGICA PLAYLIST)
    audio.addEventListener('ended', () => {
        if (audio.loop) return;

        updatePlayIcon(false);
        progressBar.style.width = '0%';

        let queue = JSON.parse(localStorage.getItem('currentQueue'));
        let currentIndex = parseInt(localStorage.getItem('queueIndex'));

        if (queue && currentIndex < queue.length - 1) {
            let nextIndex = currentIndex + 1;
            localStorage.setItem('queueIndex', nextIndex);
            localStorage.setItem('autoplayNext', 'true');
            window.location.href = "../" + queue[nextIndex].url; 
        } else {
            localStorage.removeItem('autoplayNext');
            window.location.href = "../index.html"; 
        }
    });
</script>
</body>
</html>
