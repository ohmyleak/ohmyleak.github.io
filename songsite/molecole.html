<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>!ly</title>
    <style>
        body {
            background-color: #6227eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
    
        .player-card {
            background: linear-gradient(145deg, #570a88, #2e0249);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            width: 320px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    
        .album-art {
            width: 260px;
            height: 260px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #be2edd;
        }
    
        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    
        h2 { margin: 10px 0 5px; font-size: 1.5rem; letter-spacing: 1px; }
        p { margin: 0 0 25px; font-size: 1rem; opacity: 0.8; color: #d099ff; }

        .custom-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        #progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #be2edd, #ffffff);
            border-radius: 10px;
            box-shadow: 0 0 12px #be2edd;
            transition: width 0.1s linear;
        }

        /* --- ZONA CONTROLLI BILANCIATA --- */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Distribuisce gli elementi */
            width: 100%;
            margin-top: 5px;
        }

        /* Segnaposto invisibile a sinistra per centrare il play */
        .spacer {
            width: 42px; 
        }

        .play-btn {
            background: #ffffff;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-left: 10px; /* Piccolo aggiustamento ottico */
        }

        .loop-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loop-btn svg {
            width: 22px;
            height: 22px;
            fill: rgba(255, 255, 255, 0.4);
        }

        .loop-btn.active svg {
            fill: #be2edd;
            filter: drop-shadow(0 0 8px #be2edd);
        }

        .play-btn svg {
            width: 25px;
            height: 25px;
            fill: #2e0249;
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: #be2edd;
        }

        .play-btn:hover svg {
            fill: white;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art">
            <img src="https://i.scdn.co/image/ab67616d0000b2732f362ec65a3b674cdebd19e1" alt="Copertina">
        </div>
        
        <h2>molecole</h2>
        <p>Thasup / Carattere speciale</p>

        <div class="custom-player">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div class="controls-row">
                <div class="spacer"></div>

                <button class="play-btn" id="playBtn">
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>

                <button class="loop-btn" id="loopBtn" title="Ripeti">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                    </svg>
                </button>
            </div>
        </div>

        <audio id="mainAudio">
            <source src="../music/molecole.mp3" type="audio/mpeg">
        </audio>

        <div class="footer-text">JustForMia</div>
    </div>

    <script>
        const audio = document.getElementById('mainAudio');
        const playBtn = document.getElementById('playBtn');
        const loopBtn = document.getElementById('loopBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');

        const playPath = "M8 5v14l11-7z";
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        const audioPlayer = document.querySelector('audio'); 

        audioPlayer.onended = function() {
            // Recupera la coda e l'indice attuale
            let queue = JSON.parse(localStorage.getItem('currentQueue'));
            let currentIndex = parseInt(localStorage.getItem('queueIndex'));

            if (queue && currentIndex < queue.length - 1) {
                // C'è un'altra canzone? Vai alla prossima
                let nextIndex = currentIndex + 1;
                localStorage.setItem('queueIndex', nextIndex);
                window.location.href = queue[nextIndex].url;
            } else {
                // Fine della playlist: torna alla home o ricomincia
                alert("Playlist terminata");
                window.location.href = "index.html"; // Cambia con il nome della tua home
            }
        };
    document.addEventListener("DOMContentLoaded", function() {
    const audioPlayer = document.querySelector('audio');

    // Funzione per forzare il play
    const forcePlay = () => {
        if (localStorage.getItem('autoplayNext') === 'true') {
            audioPlayer.play().then(() => {
                console.log("Riproduzione avviata con successo");
            }).catch(error => {
                // Se ancora fallisce, usiamo un trucco: al primo tocco ovunque, parte l'audio
                console.log("Autoplay bloccato. In attesa di un tocco dell'utente.");
                document.addEventListener('click', () => {
                    audioPlayer.play();
                }, { once: true });
            });
        }
    };

    // Aspettiamo che l'audio sia pronto per minimizzare i blocchi
    audioPlayer.addEventListener('canplaythrough', forcePlay, { once: true });

    // Gestione fine canzone per la prossima
    audioPlayer.onended = function() {
        let queue = JSON.parse(localStorage.getItem('currentQueue'));
        let currentIndex = parseInt(localStorage.getItem('queueIndex'));

        if (queue && currentIndex < queue.length - 1) {
            let nextIndex = currentIndex + 1;
            localStorage.setItem('queueIndex', nextIndex);
            localStorage.setItem('autoplayNext', 'true');
            window.location.href = queue[nextIndex].url;
        } else {
            localStorage.removeItem('autoplayNext');
            window.location.href = "index.html"; 
        }
    };
});

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.querySelector('path').setAttribute('d', pausePath);
            } else {
                audio.pause();
                playIcon.querySelector('path').setAttribute('d', playPath);
            }
        });

        loopBtn.addEventListener('click', () => {
            audio.loop = !audio.loop;
            loopBtn.classList.toggle('active');
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            if(!audio.loop) {
                playIcon.querySelector('path').setAttribute('d', playPath);
                progressBar.style.width = '0%';
            }
        });
    </script>

</body>
</html>
